  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:#4a4d52 transparent}
html,body{height:100%}
body{overflow:hidden;font:14px/1.6 var(--ui);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
img{display:block;max-width:100%}
::selection{background:#214283}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.ico{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor;stroke:none}

.ide{display:grid;grid-template-rows:44px minmax(0,1fr) 26px;height:100vh;height:100dvh}

/* Bilah judul */
.titlebar{display:flex;align-items:center;gap:12px;padding:0 10px 0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.project{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-weight:600;color:var(--bright)}
.project:hover{background:var(--hover)}
.mark{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--accent);color:#fff;font:600 10px var(--mono)}
.branch{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.branch .ico{width:14px;height:14px}
.wintitle{flex:1;overflow:hidden;text-align:center;white-space:nowrap;text-overflow:ellipsis;font-size:13px;color:var(--muted)}

.seg{display:flex;padding:2px;border:1px solid var(--line);border-radius:6px}

.seg button.active{background:var(--sel);color:var(--bright)}
.run{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.run:hover{background:var(--accent-2)}
.run .ico{width:11px;height:11px}

/* Area kerja */
.workspace{display:grid;grid-template-columns:44px 250px minmax(0,1fr);min-height:0}
.workspace.no-tree{grid-template-columns:44px minmax(0,1fr)}
.workspace.no-tree .tree{display:none}
.strip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;background:var(--panel);border-right:1px solid var(--line)}
.strip button,.strip span{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;color:var(--muted)}
.strip button:hover{background:var(--hover);color:var(--bright)}
.strip .on{background:var(--sel);color:var(--bright)}
.strip .ico{width:18px;height:18px}
.tree{overflow:auto;padding:4px 0 12px;background:var(--panel-2);border-right:1px solid var(--line);font-size:13px}
.tree-title{padding:8px 14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.node{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 calc(10px + var(--d) * 16px);white-space:nowrap}
.node .chev{width:10px;font-size:9px;color:var(--muted)}
.node .ico{width:15px;height:15px;color:#a0aab6}
a.node:hover{background:var(--hover)}
a.node.active{background:var(--sel);color:var(--bright)}
.fi{display:inline-grid;place-items:center;flex:none;min-width:24px;height:15px;padding:0 3px;border-radius:3px;font:600 8.5px var(--mono);text-transform:uppercase}

.fi.sql{background:#8a5d27;color:#ffe9cc}
.fi.md{background:#3d6fb0;color:#e3eeff}
.fi.json{background:#7a6c22;color:#fff6c9}

/* Editor */
.editor{display:grid;grid-template-rows:38px 30px minmax(0,1fr);min-width:0;min-height:0}
.tabs{display:flex;overflow-x:auto;background:var(--panel-2);border-bottom:1px solid var(--line);scrollbar-width:none}

.tab{position:relative;display:flex;align-items:center;gap:7px;flex:none;padding:0 14px;border-right:1px solid var(--line);font-size:13px;color:var(--muted)}

.tab.active{background:var(--bg);color:var(--bright)}

.crumbs{display:flex;align-items:center;gap:6px;overflow:hidden;padding:0 16px;border-bottom:1px solid var(--line);white-space:nowrap;font:12px var(--mono);color:var(--muted)}

.crumbs .sep{opacity:.5}
.crumbs .flag{margin-left:auto;color:var(--str)}
.view{overflow:auto;min-height:0}
.view:focus{outline:none}
.fade{animation:fade .25s ease-out}

.code{counter-reset:ln;padding:14px 0 28px;font:13.5px/1.75 var(--mono)}
.l{display:flex;padding-right:24px;counter-increment:ln}
.l::before{content:counter(ln);flex:none;width:56px;padding-right:22px;text-align:right;color:var(--gutter);user-select:none}
.l:hover{background:#26282c}
.l:hover::before{color:var(--muted)}
.ind{flex:none;white-space:pre}
.lc{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.lc a{text-decoration:underline;text-decoration-color:#6aab7366;text-underline-offset:3px}
.lc a:hover{text-decoration-color:var(--str)}
.t-k{color:var(--kw)} .t-s{color:var(--str)} .t-n{color:var(--num)} .t-f{color:var(--fn)}
.t-v{color:var(--var)} .t-c{color:var(--cmt)} .t-cl{color:var(--bright)}

/* Panel output / hasil query */
.panel{margin:0 24px 40px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.panel-head{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--muted)}

.panel-head .url{color:var(--text)}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

.pcard h3{font-size:1.1rem;line-height:1.35;color:var(--bright)}
.checks{display:grid;gap:6px;font-size:13.5px}
.checks li{display:flex;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.chip{padding:2px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font:11.5px var(--mono)}
.grid-wrap{overflow-x:auto}
.res{width:100%;border-collapse:collapse;font:13px var(--mono)}
.res th,.res td{padding:7px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.res th{background:var(--panel);font-weight:500;color:var(--muted)}

.res .c-name{color:var(--bright)}

.btn .ico{width:15px;height:15px}
.files{overflow:hidden;border:1px solid var(--line);border-radius:8px}
.frow{display:grid;grid-template-columns:36px minmax(120px,190px) minmax(0,1fr);align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.frow:first-child{border-top:0}
.frow:hover{background:var(--panel-2)}
.frow b{font-weight:500;color:var(--accent-2)}
.frow .msg{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:12.5px var(--mono);color:var(--muted)}

/* Status bar */
.status{display:flex;align-items:center;gap:16px;overflow:hidden;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);white-space:nowrap;font-size:12px;color:var(--muted)}
.status>span{display:flex;align-items:center;gap:5px}
.status .ico{width:12px;height:12px}
.status .good{color:var(--str)}
.status .sp{flex:1}
.status b{font-weight:500;color:var(--text)}

@keyframes fade{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Responsif */
@media (max-width:860px){
  .workspace,.workspace.no-tree{grid-template-columns:minmax(0,1fr)}
  .strip,.tree,.wintitle,.branch{display:none}
  .code{font-size:12.5px}
  .l::before{width:36px;padding-right:12px}
  .l{padding-right:12px}
  .md{padding:24px 18px 48px}
  .avatar{width:68px;height:68px;font-size:1.3rem}
  .md h1{font-size:1.6rem}
  .cards{grid-template-columns:1fr;padding:12px}
  .panel{margin:0 12px 32px}
  .frow{grid-template-columns:36px minmax(0,1fr)}
  .frow .msg{grid-column:2}
  .status .hide-sm{display:none}
}
</style>
</head>

/* =========================================================
   HELPER
   ========================================================= */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fullName = () => `${PROFILE.firstName} ${PROFILE.lastName}`;
const waUrl = () => `https://wa.me/${PROFILE.whatsapp}`;
const cvName = () => PROFILE.cvFile.replace(/^.*\//, "");
const activeSocials = () => PROFILE.socials.filter((s) => s.url);
const fi = (id) => `<span class="fi ${TYPES[id]}">${TYPES[id]}</span>`;
const chip = (x) => `<span class="chip">${esc(x)}</span>`;
const badge = (k, v, c) => `<span class="badge"><span>${esc(k)}</span><span style="--bc:${c}">${esc(v)}</span></span>`;
const bullets = (items, cls) => `<ul class="${cls}">${items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;

const svg = (d, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  folder: svg('<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>'),
  branch: svg('<circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7.5v9M18 10c0 4-4 4.5-10.5 7"/>'),
  db: svg('<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/>'),
  play: svg('<path d="M7 4.5v15l12-7.5z"/>', "ico fill"),
  download: svg('<path d="M12 4v11M7 10.5 12 15l5-4.5M5 20h14"/>'),
  mail: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>'),
};

/* Token syntax highlighting */
const tok = (cls) => (x) => `<span class="${cls}">${esc(x)}</span>`;
const kw = tok("t-k"), fn = tok("t-f"), num = tok("t-n"), cm = tok("t-c"), cl = tok("t-cl");
const str = (x) => `<span class="t-s">'${esc(x)}'</span>`;
const dq = (x) => `<span class="t-s">"${esc(x)}"</span>`;
const vr = (x) => `<span class="t-v">$${esc(x)}</span>`;
const jk = (x) => `<span class="t-v">"${esc(x)}"</span>`;
const I = (n) => " ".repeat(n * 4);
const code = (lines) => `<div class="code">${lines.map(([ind, html]) => `<div class="l"><span class="ind">${ind}</span><span class="lc">${html || " "}</span></div>`).join("")}</div>`;
const CI_HEAD = [
  ["", kw("<?php")],
  ["", `${fn("defined")}(${str("BASEPATH")}) ${kw("OR")} ${fn("exit")}(${str("No direct script access allowed")});`],
  ["", ""],
];

/* =========================================================
   ISI TIAP FILE
   ========================================================= */
const viewReadme = (t) => {
  const r = t.readme;
  const avatar = PROFILE.photo ? `<img src="${esc(PROFILE.photo)}" alt="${esc(r.photoAlt)}">` : esc(PROFILE.initials);
  return `
  <article class="md">
    <div class="rh"><div class="avatar">${avatar}</div><div><h1>${esc(fullName())}</h1><p>${esc(r.role)}</p></div></div>
    <div class="badges">${r.badges.map(([k, v, c]) => badge(k, v, c)).join("")}</div>
    <p>${esc(r.lead)}</p>
    <div class="btns">
      <a class="btn primary" href="${esc(PROFILE.cvFile)}" download>${ICON.download}${esc(r.btnCv)}</a>
      <a class="btn" href="mailto:${esc(PROFILE.email)}">${ICON.mail}${esc(r.btnEmail)}</a>
      <a class="btn" href="${waUrl()}" target="_blank" rel="noopener noreferrer">${esc(r.btnWa)} ↗</a>
    </div>
    <h2>${esc(r.filesTitle)}</h2>
    <div class="files">${ORDER.filter((id) => id !== "readme").map((id) =>
      `<a class="frow" href="#${id}">${fi(id)}<b>${esc(t.files[id])}</b><span class="msg">${esc(r.commits[id])}</span></a>`).join("")}
    </div>
  </article>`;
};

const viewAbout = (t) => {
  const a = t.about;
  const w = Math.max(...a.props.map(([k]) => k.length));
  const val = ([, type, v]) => type === "s" ? str(v) : type === "n" ? num(v) : type === "b" ? kw(v) : `[${v.map(str).join(", ")}]`;
  return code([
    ...CI_HEAD,
    ["", cm("/**")],
    [cm(" * "), cm(a.title)],
    ...a.paras.flatMap((p) => [[cm(" *"), ""], [cm(" * "), cm(p)]]),
    ["", cm(" */")],
    ["", `${kw("class")} ${cl(a.cls)} ${kw("extends")} ${cl("CI_Controller")}`],
    ["", "{"],
    ...a.props.map((pr) => [I(1), `${kw("public")} ${vr(pr[0])}${" ".repeat(w - pr[0].length)} = ${val(pr)};`]),
    ["", ""],
    [I(1), `${kw("public function")} ${fn("index")}()`],
    [I(1), "{"],
    [I(2), `${vr("this")}->load->${fn("view")}(${str(a.view)}, ${fn("get_object_vars")}(${vr("this")}));`],
    [I(1), "}"],
    ["", "}"],
  ]);
};

const viewProjects = (t) => {
  const p = t.projects;
  const card = (it) => `
    <article class="pcard">
      <div class="pcard-top"><span>${esc(it.platform)}</span><span class="star">${esc(it.star)}</span></div>
      <h3>${esc(it.title)}</h3>
      <p>${esc(it.desc)}</p>
      ${bullets(it.points, "checks")}
      <div class="chips">${it.tags.map(chip).join("")}</div>
    </article>`;
  return code([
    ...CI_HEAD,
    ["", `${kw("class")} ${cl(p.cls)} ${kw("extends")} ${cl("CI_Controller")}`],
    ["", "{"],
    [I(1), cm(`// ${p.comment}`)],
    [I(1), `${kw("public function")} ${fn("index")}()`],
    [I(1), "{"],
    [I(2), `${vr("this")}->load->${fn("model")}(${str(p.model)});`],
    [I(2), `${vr("data")}[${str(p.dataKey)}] = ${vr("this")}->${esc(p.model)}->${fn(p.method)}();`],
    [I(2), `${vr("this")}->load->${fn("view")}(${str(p.view)}, ${vr("data")});`],
    [I(1), "}"],
    ["", "}"],
  ]) + `
  <section class="panel" aria-label="${esc(p.runLabel)}">
    <div class="panel-head">${ICON.play}<span>${esc(p.runLabel)}</span><span class="url">${esc(p.url)}</span><span class="ok">200 OK</span></div>
    <div class="cards">${p.items.map(card).join("")}</div>
  </section>`;
};

const viewSkills = (t) => {
  const s = t.skills;
  const rows = s.rows.slice().sort((a, b) => a[1].localeCompare(b[1])); // benar-benar ORDER BY kategori
  return code([
    ["", cm(`-- ${s.comment}`)],
    ["", `${kw("SELECT")} ${esc(s.cols.join(", "))}`],
    ["", `${kw("FROM")} ${esc(s.table)}`],
    ["", `${kw("ORDER BY")} ${esc(s.cols[1])};`],
  ]) + `
  <section class="panel" aria-label="${esc(s.resultLabel)}">
    <div class="panel-head">${ICON.db}<span>${esc(s.resultLabel)}</span><span class="ok">${rows.length} ${esc(s.rowsLabel)}</span></div>
    <div class="grid-wrap"><table class="res">
      <thead><tr><th class="idx">#</th>${s.cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((r, i) => `<tr><td class="idx">${i + 1}</td><td class="c-name">${esc(r[0])}</td><td class="c-cat">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>`;
};

const viewEdu = (t) => {
  const e = t.edu;
  return `
  <article class="md">
    <h1>${esc(e.title)}</h1>
    <h2>${esc(e.degree)}</h2>
    <p>${esc(e.meta)}</p>
    <div class="badges">${badge(e.gpaLabel, e.gpa, "#3574f0")}</div>
    <h3>${esc(e.thesisLabel)}</h3>
    <blockquote>${esc(PROFILE.thesisTitle)}</blockquote>
    <h3>${esc(e.highlightsLabel)}</h3>
    ${bullets(e.highlights, "bul")}
    <h3>${esc(e.langLabel)}</h3>
    ${bullets(e.langs, "bul")}
  </article>`;
};

const viewContact = (t) => {
  const c = t.contact, k = c.keys;
  const ext = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${dq(text)}</a>`;
  return code([
    ["", "{"],
    [I(1), `${jk(k.email)}: <a href="mailto:${esc(PROFILE.email)}">${dq(PROFILE.email)}</a>,`],
    [I(1), `${jk(k.wa)}: ${ext(waUrl(), PROFILE.phone)},`],
    ...activeSocials().map((s) => [I(1), `${jk(s.label.toLowerCase())}: ${ext(s.url, s.url)},`]),
    [I(1), `${jk(k.loc)}: ${dq(c.location)},`],
    [I(1), `${jk(k.open)}: [`],
    ...c.open.map((o, i) => [I(2), `${dq(o)}${i < c.open.length - 1 ? "," : ""}`]),
    [I(1), "],"],
    [I(1), `${jk(k.cv)}: <a href="${esc(PROFILE.cvFile)}" download>${dq(cvName())}</a>`],
    ["", "}"],
  ]) + `
  <section class="panel" aria-label="${esc(c.actionsLabel)}">
    <div class="panel-head">${ICON.play}<span>${esc(c.actionsLabel)}</span></div>
    <div class="actions">
      <a class="btn primary" href="mailto:${esc(PROFILE.email)}">${ICON.mail}${esc(c.btnEmail)}</a>
      <a class="btn" href="${waUrl()}" target="_blank" rel="noopener noreferrer">${esc(c.btnWa)} ↗</a>
      <a class="btn" href="${esc(PROFILE.cvFile)}" download>${ICON.download}${esc(c.btnCv)}</a>
    </div>
  </section>`;
};

const VIEWS = { readme: viewReadme, tentang: viewAbout, proyek: viewProjects, keahlian: viewSkills, pendidikan: viewEdu, kontak: viewContact };

/* =========================================================
   KERANGKA IDE
   ========================================================= */
const renderShell = (t) => `
<div class="ide">
  <header class="titlebar">
    <a class="project" href="#readme"><span class="mark">${esc(PROFILE.initials)}</span>${esc(PROFILE.repo)}</a>
    <span class="branch">${ICON.branch}main</span>
    <p class="wintitle" id="wintitle"></p>
    <div class="tb-right">
      <div class="seg" role="group" aria-label="Bahasa / Language">
        ${["id", "en"].map((l) => `<button type="button" data-lang="${l}" class="${l === state.lang ? "active" : ""}" aria-pressed="${l === state.lang}">${l.toUpperCase()}</button>`).join("")}
      </div>
      <a class="run" href="${esc(PROFILE.cvFile)}" download>${ICON.play}<span>${esc(t.ui.cv)}</span></a>
    </div>
  </header>

  <div class="workspace${state.tree ? "" : " no-tree"}" id="ws">
    <nav class="strip" aria-label="Tool windows">
      <button type="button" id="toggle-tree" class="${state.tree ? "on" : ""}" aria-pressed="${state.tree}" aria-label="${esc(t.ui.toggleTree)}" title="${esc(t.ui.toggleTree)}">${ICON.folder}</button>
      <span>${ICON.branch}</span>
      <span>${ICON.db}</span>
    </nav>
    <nav class="tree" aria-label="${esc(t.ui.panel)}">
      <p class="tree-title">${esc(t.ui.panel)}</p>
      ${TREE.map(([d, kind, x]) => kind === "dir"
        ? `<div class="node" style="--d:${d}"><span class="chev">▾</span>${ICON.folder}${esc(x)}</div>`
        : `<a class="node" href="#${x}" data-file="${x}" style="--d:${d}"><span class="chev"></span>${fi(x)}${esc(t.files[x])}</a>`).join("")}
    </nav>
    <section class="editor">
      <nav class="tabs" aria-label="Tabs">${ORDER.map((id) => `<a class="tab" href="#${id}" data-file="${id}">${fi(id)}${esc(t.files[id])}</a>`).join("")}</nav>
      <div class="crumbs" id="crumbs"></div>
      <main class="view" id="view" tabindex="-1"></main>
    </section>
  </div>

  <footer class="status">
    <span>${ICON.branch}main</span>
    <span class="good">✓ ${esc(t.ui.problems)}</span>
    <span class="sp"></span>
    <span class="hide-sm">PHP · CodeIgniter 3 · PostgreSQL</span>
    <span class="hide-sm">UTF-8</span>
    <span>Batam <b id="clock">--:--</b> WIB</span>
  </footer>
</div>`;

/* =========================================================
   INTERAKSI
   ========================================================= */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* abaikan */ } },
};

const state = { lang: "id", file: "readme", tree: store.get("ide-tree") !== "0" };
let clockTimer = null;

function openFile(id) {
  state.file = ORDER.includes(id) ? id : "readme";
  const t = CONTENT[state.lang];
  const name = t.files[state.file];
  document.querySelectorAll("[data-file]").forEach((el) => {
    const on = el.dataset.file === state.file;
    el.classList.toggle("active", on);
    if (on) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
  });
  const parts = [PROFILE.repo, ...PATHS[state.file]].map((p) => `<span>${esc(p)}</span><span class="sep">›</span>`).join("");
  const flag = TYPES[state.file] === "md" ? `◧ ${esc(t.ui.preview)}` : "✓";
  document.getElementById("crumbs").innerHTML = `${parts}<b>${esc(name)}</b><span class="flag">${flag}</span>`;
  document.getElementById("wintitle").textContent = `${PROFILE.repo} – ${name}`;
  const view = document.getElementById("view");
  view.innerHTML = `<div class="fade">${VIEWS[state.file](t)}</div>`;
  view.scrollTop = 0;
  const tab = document.querySelector(".tab.active");
  if (tab) tab.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function startClock() {
  clearInterval(clockTimer);
  const el = document.getElementById("clock");
  const fmt = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Jakarta" });
  const tick = () => { el.textContent = fmt.format(new Date()); };
  tick();
  clockTimer = setInterval(tick, 15000);
}

function bindUI() {
  document.querySelectorAll("[data-lang]").forEach((b) => (b.onclick = () => {
    setLang(b.dataset.lang);
    document.querySelector(`[data-lang="${b.dataset.lang}"]`).focus();
  }));
  const btn = document.getElementById("toggle-tree");
  btn.onclick = () => {
    state.tree = !state.tree;
    store.set("ide-tree", state.tree ? "1" : "0");
    document.getElementById("ws").classList.toggle("no-tree", !state.tree);
    btn.classList.toggle("on", state.tree);
    btn.setAttribute("aria-pressed", state.tree);
  };
}

function setLang(lang) {
  state.lang = CONTENT[lang] ? lang : "id";
  document.documentElement.lang = state.lang;
  store.set("portfolio-lang", state.lang);
  document.getElementById("app").innerHTML = renderShell(CONTENT[state.lang]);
  bindUI();
  openFile(state.file);
  startClock();
}

window.addEventListener("hashchange", () => openFile(location.hash.slice(1)));
state.file = location.hash.slice(1) || "readme";
setLang(store.get("portfolio-lang") === "en" ? "en" : "id");
</script>
